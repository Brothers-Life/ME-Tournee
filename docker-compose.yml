# Postgres + Redis pour le développement local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: me
      POSTGRES_PASSWORD: me
      POSTGRES_DB: me_tournee
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  dbdata:
